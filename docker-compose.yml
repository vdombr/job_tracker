---
services:
  app:
    build: "./api"
    ports:
    - 9292:9292
    environment:
      DATABASE_URL: postgres://rivulet:rivulet@db:5432/job_tracker_development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
    - "./api:/app"
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rivulet
      POSTGRES_PASSWORD: rivulet
      POSTGRES_DB: job_tracker_development
    ports:
    - 5432:5432
    volumes:
    - db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - "pg_isready -U rivulet -d job_tracker_development"
      interval: 5s
      timeout: 3s
      retries: 5
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
    - 3001:3000
    - 4318:4318
  frontend:
    image: node:24-alpine
    user: 'node'
    working_dir: /home/node/app
    volumes:
      - "./web:/home/node/app"
    ports:
      - 3000:3000
    command: ['npm', 'run', 'dev']
  proxy:
    image: nginx:stable-alpine
    environment:
      - NGINX_PORT=80
    ports:
      - 8080:80
    volumes:
      - "./.nginx/job_tracker.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - app
      - frontend
volumes:
  db:
